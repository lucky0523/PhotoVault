<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 小尺寸专用（≤64px 展示）：无文字，只保留拍立得相框 + 山景 + 太阳 -->
  <defs>
    <linearGradient id="cBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0464F"/>
      <stop offset="1" stop-color="#B3123A"/>
    </linearGradient>
    <clipPath id="photoClip">
      <rect x="100" y="96" width="312" height="264" rx="14"/>
    </clipPath>
  </defs>
  <!-- 背景 -->
  <rect width="512" height="512" rx="112" fill="url(#cBg)"/>
  <!-- 拍立得相框 -->
  <rect x="84" y="80" width="344" height="352" rx="28" fill="#FFF3E6"/>
  <!-- 照片窗口 -->
  <rect x="100" y="96" width="312" height="264" rx="14" fill="url(#cBg)"/>
  <!-- 太阳 -->
  <circle cx="316" cy="160" r="36" fill="#FFC93C"/>
  <g clip-path="url(#photoClip)">
    <!-- 远山 -->
    <path fill="#8A0A2C" opacity="0.5" d="M100 360 V262 L150 226 L200 254 L262 196 L320 240 L370 206 L412 232 V360 Z"/>
    <!-- 近山 -->
    <path fill="#8A0A2C" d="M100 360 V292 L168 236 L222 282 L290 214 L362 278 L412 248 V360 Z"/>
  </g>
</svg>
